name: Deploy FellowTrack to GitHub Pages
on:
  push:
    branches: [main]
  schedule:
    - cron: '17 * * * *'   # hourly refresh of the private calendar feed
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Private calendar feed (optional)
        env:
          DATA_TOKEN: ${{ secrets.DATA_TOKEN }}
          CAL_SECRET: ${{ secrets.CAL_SECRET }}
        run: |
          if [ -n "$DATA_TOKEN" ] && [ -n "$CAL_SECRET" ]; then node scripts/make-ics.mjs; else echo "calendar feed not configured"; fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
